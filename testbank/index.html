<!DOCTYPE html>
<html lang="sv">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Testbänk – analysmodell</title>
<style>
  :root { --bg:#000; --panel:#1c1c1e; --panel-2:#2c2c2e; --line:rgba(255,255,255,.14);
    --ink:#fff; --dim:#98989f; --yellow:#ffd60a; --green:#30d158; --blue:#0a84ff; --red:#ff453a; }
  * { box-sizing:border-box; border-radius:0; }
  body { margin:0; background:var(--bg); color:var(--ink); font:15px/1.45 -apple-system,system-ui,sans-serif; padding:24px; max-width:1100px; }
  h1 { font-size:22px; margin:0 0 4px; } h2 { font-size:16px; margin:28px 0 10px; color:var(--yellow); text-transform:uppercase; letter-spacing:.06em; }
  .dim { color:var(--dim); } .card { background:var(--panel); padding:16px; margin-bottom:12px; }
  button { background:var(--yellow); color:#000; border:0; font-weight:600; font-size:15px; font-family:inherit; padding:12px 20px; cursor:pointer; }
  button:disabled { opacity:.4; cursor:default; }
  label { margin-left:16px; color:var(--dim); }
  table { border-collapse:collapse; width:100%; } th,td { text-align:left; padding:6px 10px; border-bottom:1px solid var(--line); vertical-align:top; }
  th { color:var(--dim); font-weight:500; font-size:13px; } td.n, th.n { text-align:right; font-variant-numeric:tabular-nums; }
  .bar { height:8px; background:var(--panel-2); min-width:80px; } .bar i { display:block; height:100%; background:var(--green); }
  .big { font-size:34px; font-weight:700; } .grid { display:grid; grid-template-columns:repeat(auto-fit,minmax(240px,1fr)); gap:12px; }
  .tag { display:inline-block; padding:1px 8px; background:var(--panel-2); font-size:13px; } .tag.ok { color:var(--green); } .tag.bad { color:var(--red); } .tag.q { color:var(--yellow); }
  progress { width:100%; height:10px; } code { background:var(--panel-2); padding:1px 6px; }
  #felLista .rad { background:var(--panel); padding:12px 16px; margin-bottom:8px; border-left:3px solid var(--red); }
  .rad .kom { color:var(--dim); font-size:13px; margin-top:4px; }
</style>
</head>
<body>
<h1>Testbänk – analysmodell</h1>
<div class="dim">Utvecklingsverktyg. Hämtar modellen från Hugging Face; ingår inte i driftappen.</div>

<div class="card" style="margin-top:16px">
  <button id="kor">Kör testbänk</button>
  <label><input type="checkbox" id="exOsakra"> Exkludera meningar markerade <code>osaker</code> ur träffsäkerheten</label>
  <div id="modellInfo" class="dim" style="margin-top:10px"></div>
  <progress id="prog" value="0" max="1" hidden></progress>
  <div id="status" class="dim" style="margin-top:6px"></div>
</div>

<div id="resultat" hidden>
  <div class="grid" id="sammanfattning"></div>
  <h2>Utfall – förväxlingsmatris</h2><div id="matris"></div>
  <h2>Träffsäkerhet per område</h2><div id="perOmrade"></div>
  <h2>Felklassade meningar</h2><div id="felLista"></div>
</div>

<script type="module">
import { pipeline, env } from 'https://cdn.jsdelivr.net/npm/@huggingface/transformers@3.7.6/dist/transformers.min.js';

// ---- Lås: modell och version -------------------------------------------
const MODELL_ID = 'Xenova/multilingual-e5-small';
// Fyll i fast commit-hash för att låsa. Är den null slås aktuell hash upp
// från Hugging Face, visas nedan och används för körningen (kopiera in den här).
const MODELL_REVISION = null;
const DTYPE = 'q8';                       // kvantiserad (model_quantized.onnx)
const PREFIX = 'query: ';                 // enligt CLAUDE.md, gäller all text som embeddas

// Utfallsbeskrivningar (testbänkens egna, justeras fritt).
const UTFALL_BESKR = {
  behov:   'Något laget brister i och behöver träna på eller förbättra, ett problem i vårt spel.',
  styrka:  'Något laget gjorde bra, en styrka eller positiv insats av laget.',
  kontext: 'Fakta om motståndaren, matchen, serien eller nivån, utan bedömning av vårt eget spel.',
  spelare: 'Omdöme eller notering om en enskild namngiven spelare.'
};

const $ = id => document.getElementById(id);
const esc = s => String(s ?? '').replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const pct = (a, b) => b ? (100 * a / b).toFixed(1) + ' %' : '–';
const dot = (a, b) => { let s = 0; for (let i = 0; i < a.length; i++) s += a[i] * b[i]; return s; };

async function hamtaData() {
  const r = await fetch('testmeningar.json');
  if (!r.ok) throw new Error('Kunde inte läsa testmeningar.json (' + r.status + '). Servera mappen över http, inte file://.');
  return r.json();
}

async function losRevision() {
  if (MODELL_REVISION) return MODELL_REVISION;
  const r = await fetch('https://huggingface.co/api/models/' + MODELL_ID);
  if (!r.ok) throw new Error('Kunde inte slå upp modellens revision (' + r.status + ')');
  return (await r.json()).sha;
}

async function embedAlla(extractor, texter) {
  const ut = [];
  for (let i = 0; i < texter.length; i++) {
    const o = await extractor(PREFIX + texter[i], { pooling: 'mean', normalize: true });
    ut.push(Array.from(o.data));
    $('status').textContent = 'Embeddar ' + (i + 1) + ' / ' + texter.length;
  }
  return ut;
}

function rangordna(vec, nycklar, vektorer) {
  return nycklar.map((k, i) => ({ k, s: dot(vec, vektorer[i]) })).sort((a, b) => b.s - a.s);
}

$('kor').onclick = async () => {
  $('kor').disabled = true; $('resultat').hidden = true;
  try {
    const data = await hamtaData();
    const rev = await losRevision();
    $('modellInfo').innerHTML = 'Modell <code>' + esc(MODELL_ID) + '</code> · dtype <code>' + DTYPE +
      '</code> · revision <code>' + esc(rev) + '</code>' + (MODELL_REVISION ? '' : ' <span class="tag q">ej låst i filen</span>') +
      ' · Transformers.js 3.7.6';
    env.allowLocalModels = false;
    $('prog').hidden = false;
    const filer = {};
    const extractor = await pipeline('feature-extraction', MODELL_ID, {
      dtype: DTYPE, revision: rev,
      progress_callback: p => {
        if (p.status === 'progress' && p.file) { filer[p.file] = p; const t = Object.values(filer);
          $('prog').value = t.reduce((a, x) => a + x.loaded, 0) / t.reduce((a, x) => a + x.total, 0);
          $('status').textContent = 'Hämtar modell… ' + p.file; }
      }
    });
    $('prog').hidden = true;

    const omrKeys = Object.keys(data.omraden), utfKeys = Object.keys(UTFALL_BESKR);
    const omrVek = await embedAlla(extractor, omrKeys.map(k => data.omraden[k]));
    const utfVek = await embedAlla(extractor, utfKeys.map(k => UTFALL_BESKR[k]));
    const menVek = await embedAlla(extractor, data.meningar.map(m => m.text));

    const ex = $('exOsakra').checked;
    const rader = data.meningar.map((m, i) => ({
      m, utf: rangordna(menVek[i], utfKeys, utfVek), omr: rangordna(menVek[i], omrKeys, omrVek)
    }));
    visa(data, rader, ex, utfKeys, omrKeys);
    $('status').textContent = 'Klart.';
  } catch (e) {
    $('status').textContent = 'Fel: ' + e.message; console.error(e);
  } finally { $('kor').disabled = false; }
};

function visa(data, rader, ex, utfKeys, omrKeys) {
  const medtag = r => !(ex && r.m.osaker);
  const U = rader.filter(medtag);
  const O = rader.filter(r => medtag(r) && r.m.omrade);   // områden finns bara för behov/styrka
  const uRatt = U.filter(r => r.utf[0].k === r.m.utfall).length;
  const oRatt = O.filter(r => r.omr[0].k === r.m.omrade).length;
  const oTop3 = O.filter(r => r.omr.slice(0, 3).some(x => x.k === r.m.omrade)).length;

  $('sammanfattning').innerHTML =
    kort('Utfall', pct(uRatt, U.length), uRatt + ' av ' + U.length + ' meningar') +
    kort('Område (topp 1)', pct(oRatt, O.length), oRatt + ' av ' + O.length + ' med område') +
    kort('Område (topp 3)', pct(oTop3, O.length), oTop3 + ' av ' + O.length + ' – så som Granska visar förslag');

  // Förväxlingsmatris utfall
  const mx = {}; utfKeys.forEach(a => { mx[a] = {}; utfKeys.forEach(b => mx[a][b] = 0); });
  U.forEach(r => mx[r.m.utfall][r.utf[0].k]++);
  $('matris').innerHTML = '<table><tr><th>Rätt ↓ / Förslag →</th>' + utfKeys.map(k => '<th class="n">' + k + '</th>').join('') + '<th class="n">Träff</th></tr>' +
    utfKeys.map(a => { const tot = utfKeys.reduce((s, b) => s + mx[a][b], 0);
      return '<tr><td>' + a + '</td>' + utfKeys.map(b => '<td class="n"' + (a === b ? ' style="color:var(--green)"' : '') + '>' + mx[a][b] + '</td>').join('') +
        '<td class="n">' + pct(mx[a][a], tot) + '</td></tr>'; }).join('') + '</table>';

  // Per område
  $('perOmrade').innerHTML = '<table><tr><th>Område</th><th class="n">Antal</th><th class="n">Rätt (topp 1)</th><th></th><th class="n">Topp 3</th></tr>' +
    omrKeys.map(k => { const g = O.filter(r => r.m.omrade === k); if (!g.length) return '';
      const a = g.filter(r => r.omr[0].k === k).length, t = g.filter(r => r.omr.slice(0, 3).some(x => x.k === k)).length;
      return '<tr><td>' + esc(k) + '</td><td class="n">' + g.length + '</td><td class="n">' + pct(a, g.length) +
        '</td><td><div class="bar"><i style="width:' + (100 * a / g.length) + '%"></i></div></td><td class="n">' + pct(t, g.length) + '</td></tr>'; }).join('') + '</table>';

  // Felklassade (utfall eller område fel)
  const fel = rader.filter(medtag).filter(r => r.utf[0].k !== r.m.utfall || (r.m.omrade && r.omr[0].k !== r.m.omrade));
  $('felLista').innerHTML = '<div class="dim" style="margin-bottom:8px">' + fel.length + ' av ' + U.length + ' meningar klassades fel.</div>' + fel.map(r => {
    const uFel = r.utf[0].k !== r.m.utfall, oFel = r.m.omrade && r.omr[0].k !== r.m.omrade;
    return '<div class="rad"><div>' + esc(r.m.text) + (r.m.osaker ? ' <span class="tag q">osäker etikett</span>' : '') + '</div>' +
      (uFel ? '<div>Utfall: förslag <span class="tag bad">' + r.utf[0].k + '</span> (' + r.utf[0].s.toFixed(3) + ') · rätt <span class="tag ok">' + r.m.utfall + '</span></div>' : '') +
      (oFel ? '<div>Område: förslag <span class="tag bad">' + r.omr[0].k + '</span> (' + r.omr[0].s.toFixed(3) + ') · rätt <span class="tag ok">' + r.m.omrade + '</span>' +
        ' · topp 3: ' + r.omr.slice(0, 3).map(x => esc(x.k)).join(', ') + '</div>' : '') +
      (r.m.kommentar ? '<div class="kom">' + esc(r.m.kommentar) + '</div>' : '') + '</div>';
  }).join('');
  $('resultat').hidden = false;
}
const kort = (t, v, u) => '<div class="card"><div class="dim">' + t + '</div><div class="big">' + v + '</div><div class="dim">' + u + '</div></div>';
</script>
</body>
</html>
